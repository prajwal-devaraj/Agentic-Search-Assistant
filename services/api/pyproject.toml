[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prajna-api"
version = "0.1.0"
description = "PRAJNA universal agentic search API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "httpx>=0.28,<1.0",
  "openai>=1.100,<3.0",
  "redis>=6,<8",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
